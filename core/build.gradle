[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  // ─── Project Shadow specific ───
  // JSON parsing (Stage_*.json)
  api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
  api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

  // CSV parsing (Heroes_FIXED.csv, Skills_v3_FIXED.csv, ...)
  api 'com.opencsv:opencsv:5.9'

  // Logging
  api 'org.slf4j:slf4j-api:2.0.16'
  api 'ch.qos.logback:logback-classic:1.5.12'

  // Lombok (compile-time annotation)
  compileOnly 'org.projectlombok:lombok:1.18.36'
  annotationProcessor 'org.projectlombok:lombok:1.18.36'

  // ─── Test ───
  testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
  testImplementation 'org.assertj:assertj-core:3.26.3'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
test {
  useJUnitPlatform()
}

tasks.register('runDemo', JavaExec) {
  group = 'application'
  description = 'Run DataLoaderDemo CLI to verify all CSV/JSON load and FK refs are valid.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.trungbui.projectshadow.data.DataLoaderDemo'
  workingDir = rootProject.projectDir
  args 'assets/data'
  standardOutput = System.out
  errorOutput = System.err
}

// Sprint 9 — pack PNGs in assets/sprites/raw/ into a single combatants.atlas.
// Keeps gdx-tools out of the runtime classpath via a dedicated configuration.
configurations {
  packAssetsTool
}

dependencies {
  packAssetsTool "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
}

tasks.register('packAssets', JavaExec) {
  group = 'build'
  description = 'Pack Aseprite-exported PNGs (assets/sprites/raw/*.png) into combatants.atlas + combatants.png.'
  classpath = configurations.packAssetsTool
  mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
  args = [
    "${rootProject.projectDir}/assets/sprites/raw",
    "${rootProject.projectDir}/assets/sprites",
    'combatants'
  ]
  // Don't fail the task if input dir is empty — Sprint 9 ships with no sprites yet.
  ignoreExitValue = true
}
